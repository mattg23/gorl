[package]
name = "gorl"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.100"
env_logger = "0.11.8"
log = "0.4.28"
config = "0.15.19"
serde = { version = "1.0.228", features = ["derive"] }
serde_derive = "1.0.228"
lazy_static = "1.5.0"
grep = "0.4.1"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.43"
tracing-subscriber = "0.3.22"
memory-stats = "1.2.0"
humansize = "2.1.3"
once_cell = "1.21.3"
tempfile = "3.23.0"
bitpacking = "0.9.2"
fltk = { version = "^1.5", features = ["fltk-bundled"] }
fltk-theme = "0.7.9"
skia-safe = { version = "0.90.0", features = ["textlayout"] }
urlencoding = "2.1.3"
lru = "0.16.2"

[profile.prod]
inherits = "release"
lto = true
codegen-units = 1

[profile.bench]
inherits = "prod"
panic = "abort"
debug = true
